name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dashboard/data.json'
      - 'dashboard/alert_state.json'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Python and shell scripts
        run: |
          python3 -m py_compile scripts/fetch_dashboard.py scripts/monitoring/*.py api/api_server.py alert/notify.py
          bash -n scripts/push_data.sh api/deploy.sh api/deploy-mac.sh
      - name: Check dashboard JS syntax
        run: |
          node -e "const fs=require('fs'), h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script>([\s\S]*)<\/script>/); new Function(m[1]);"
      - name: Run unit and Python/JS parity tests
        run: python3 -m unittest discover -s tests -v
