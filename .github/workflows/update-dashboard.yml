name: Update dashboard data

on:
  schedule:
    # Twice a day after the US close (16:00 ET = 21:00 UTC): 21:30 UTC
    # (05:30 Beijing next day) picks up the new close, 23:30 UTC
    # (07:30 Beijing) is a retry in case the first run hit Yahoo's
    # rate limit. Data is daily closes, so running every 30 minutes
    # only wastes runs and Yahoo quota.
    - cron: "30 21,23 * * *"
  workflow_dispatch:
    inputs:
      manual_push:
        description: 'Manual push to Feishu + Bark (test = one test message, status = current 5-indicator summary)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - test
          - status

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional curl_cffi for Yahoo TLS impersonation
        run: python3 -m pip install --quiet curl_cffi

      - name: Fetch latest closes
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          BARK_URL: ${{ secrets.BARK_URL }}
          MANUAL_PUSH: ${{ inputs.manual_push }}
        run: python3 scripts/fetch_dashboard.py

      - name: Commit data.json and alert_state.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json dashboard/alert_state.json
          git diff --cached --quiet || git commit -m "chore: update dashboard data"
          git push
